{{define "content"}}
<h1>Audit</h1>
{{with .Data}}
{{if not .}}
  <p class="empty">Nothing recorded yet.</p>
{{else}}
<div class="tablewrap"><table class="grid">
  <thead><tr><th>When</th><th>Who</th><th>Action</th><th>Target</th><th>Detail</th></tr></thead>
  <tbody>
  {{range .}}
    <tr>
      <td class="mono small" title="{{ts .At}}">{{ts .At}}</td>
      <td>{{.Actor}}</td>
      <td class="mono">{{.Action}}</td>
      <td class="mono">{{.Target}}</td>
      <td class="muted small">{{.Detail}}</td>
    </tr>
  {{end}}
  </tbody>
</table></div>
{{end}}
{{end}}
{{end}}

name: os-e2e

# Tier 2: the real-OS end-to-end suite. GitHub-hosted runners ARE real Windows and
# real macOS (on Apple hardware), so this exercises the actual registry, actual
# local accounts, actual services/launchd and actual /Applications writes.
#
# The VM tier (test/e2e/vm/*) is not here on purpose: it needs KVM, ~40 GB of
# disk, and macOS virtualisation is only licensed on Apple hardware.
#
# The fleet server is started and stopped inside the SAME step that runs the
# suite: GitHub Actions tears down the process tree at the end of each step, so
# a server started in an earlier step is gone by the time the tests run.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by release.yml so a release cannot be cut unless the real-OS suites pass.
  workflow_call:
    inputs:
      concurrency_suffix:
        description: 'Distinguishes a release gate from a push run on the same ref'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: os-e2e-${{ github.ref }}-${{ inputs.concurrency_suffix }}
  cancel-in-progress: true

jobs:
  suite:
    name: real ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A hung native tool (codesign, launchctl, security) must fail the job in
    # minutes, not burn the runner for the 6h default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suite: windows
          - os: macos-latest
            suite: macos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        shell: bash
        # NOTE: `-o bin/` would name the binaries after their *package*
        # directories (server, agent) and skip the .exe suffix on Windows,
        # so name them explicitly instead.
        run: |
          mkdir -p bin
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -o "bin/fleet-server$ext" ./cmd/server
          go build -trimpath -o "bin/fleet-agent$ext" ./cmd/agent

      - name: suite (windows)
        if: matrix.suite == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:FLEET_ADMIN_TOKEN = "e2e-vm-admin-token"
          $exe = Join-Path $PWD 'bin\fleet-server.exe'
          if (-not (Test-Path $exe)) { Get-ChildItem bin; throw "server binary missing: $exe" }

          $log = Join-Path $env:RUNNER_TEMP 'server.log'
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardError $log `
            -ArgumentList '-addr','127.0.0.1:8080','-db',(Join-Path $env:RUNNER_TEMP 'fleet.db'),
                          '-key',(Join-Path $env:RUNNER_TEMP 'fleet.key'),'-log-level','warn'

          $rc = 1
          try {
            $up = $false
            for ($i = 0; $i -lt 60; $i++) {
              try { Invoke-RestMethod http://127.0.0.1:8080/healthz -TimeoutSec 2 | Out-Null; $up = $true; break }
              catch { Start-Sleep -Seconds 1 }
            }
            if (-not $up) { Get-Content $log -Raw; throw "server never became healthy" }

            .\test\e2e\guest\verify.ps1 `
              -Server http://127.0.0.1:8080 `
              -AdminToken e2e-vm-admin-token `
              -Agent .\bin\fleet-agent.exe `
              -Installer .\scripts\install-windows.ps1
            $rc = $LASTEXITCODE
          } finally {
            Copy-Item C:\fleet-e2e-results.json (Join-Path $env:RUNNER_TEMP 'fleet-e2e-results.json') -ErrorAction SilentlyContinue
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
          exit $rc

      - name: suite (macos)
        if: matrix.suite == 'macos'
        shell: bash
        run: |
          set -uo pipefail
          ./bin/fleet-server -addr 127.0.0.1:8080 \
            -db "$RUNNER_TEMP/fleet.db" -key "$RUNNER_TEMP/fleet.key" \
            -admin-token e2e-vm-admin-token -log-level warn >"$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          up=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then up=1; break; fi
            sleep 1
          done
          if [ "$up" -ne 1 ]; then cat "$RUNNER_TEMP/server.log"; exit 1; fi

          sudo env SERVER=http://127.0.0.1:8080 \
            ADMIN_TOKEN=e2e-vm-admin-token \
            AGENT="$PWD/bin/fleet-agent" \
            INSTALLER="$PWD/scripts/install-unix.sh" \
            bash test/e2e/guest/verify.sh

      - name: upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-e2e-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/server.log
            ${{ runner.temp }}/fleet-e2e-results.json
          if-no-files-found: ignore

name: release

# Three ways to cut a release:
#
#   1. Automatically, by pushing a tag:      git tag v0.2.0 && git push origin v0.2.0
#   2. Automatically, from main, when the   git commit -m "feat: x [release]"
#      head commit is marked [release]       (version is bumped for you)
#   3. By hand, from the Actions tab:       Release -> Run workflow
#      (leave "version" empty to auto-bump from the latest tag)
#
# Nothing is published unless the full suite passes on the exact commit: the
# same `ci` workflow that runs on every push (unit tests on Linux, macOS and
# Windows, plus the logical end-to-end test) and the same `os-e2e` workflow that
# runs the real-OS suites on GitHub's Windows and macOS runners. Those are called
# as reusable workflows, so there is a single definition of "passing".
#
# After publishing, a final job downloads the release again and verifies
# byte-identity, the checksums and that the linux binaries execute.

on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. v0.2.0. Leave empty to auto-bump from the latest tag.'
        required: false
        type: string
      prerelease:
        description: 'Mark as a pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create as a draft (not visible until published)'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Build and verify only; do not create a release'
        required: false
        default: false
        type: boolean
      allow_any_commit:
        description: 'Allow releasing a commit that is not an ancestor of origin/main'
        required: false
        default: false
        type: boolean

# Read-only by default: the write token is granted only to the publish job.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: decide version
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      prerelease: ${{ steps.decide.outputs.prerelease }}
      draft: ${{ steps.decide.outputs.draft }}
      dry_run: ${{ steps.decide.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history are needed to compute the next version

      - name: decide
        id: decide
        shell: bash
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_PRERELEASE: ${{ inputs.prerelease }}
          IN_DRAFT: ${{ inputs.draft }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_ALLOW_ANY_COMMIT: ${{ inputs.allow_any_commit }}
        run: |
          set -euo pipefail

          emit() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          next_version() {
            local latest base major minor patch
            latest=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            if [ -z "$latest" ]; then
              echo "v0.1.0"
              return
            fi
            base=${latest#v}
            base=${base%%-*}          # strip -rc1 etc.
            major=${base%%.*}
            rest=${base#*.}
            minor=${rest%%.*}
            patch=${rest#*.}
            # A feature commit bumps the minor, anything else the patch.
            if git log "$latest..HEAD" --pretty=%s | grep -qE '^feat(\(.+\))?!?:'; then
              minor=$((minor + 1))
              patch=0
            else
              patch=$((patch + 1))
            fi
            echo "v${major}.${minor}.${patch}"
          }

          release=false
          version=""
          prerelease="${IN_PRERELEASE:-false}"
          draft="${IN_DRAFT:-false}"
          dry_run="${IN_DRY_RUN:-false}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
            release=true
            echo "tag push: releasing $version"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            release=true
            version="${IN_VERSION:-}"
            if [ -z "$version" ]; then
              version=$(next_version)
              echo "manual run without a version: computed $version"
            fi
          else
            # Push to main: opt in with [release] in the head commit message.
            if git log -1 --pretty=%B | grep -qF '[release]'; then
              release=true
              version=$(next_version)
              echo "head commit is marked [release]: computed $version"
            else
              echo "push to main without a [release] marker; nothing to do"
            fi
          fi

          if [ "$release" = "true" ]; then
            # Only release what is on main (or a tag reachable from it), unless the
            # operator explicitly overrides. Tags and manual runs used to be able to
            # publish any branch.
            if [ "${IN_ALLOW_ANY_COMMIT:-false}" != "true" ]; then
              git fetch -q --no-tags origin +refs/heads/main:refs/remotes/origin/main || true
              if git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
                if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
                  echo "::error::$GITHUB_SHA is not on main; re-run with allow_any_commit=true if this is intentional"
                  exit 1
                fi
              fi
            fi
            if ! printf '%s' "$version" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
              echo "::error::'$version' is not a valid version (expected vMAJOR.MINOR.PATCH[-pre])"
              exit 1
            fi
            if [ "${GITHUB_REF_TYPE}" != "tag" ] && git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
              echo "::error::tag $version already exists; pick another version"
              exit 1
            fi
            {
              echo "### release $version"
              echo
              echo '```'
              git log -1 --pretty='%h %s'
              echo '```'
              echo
              echo 'Gate: the full `ci` suite (unit tests on Linux/macOS/Windows plus logical e2e)'
              echo 'and the `os-e2e` real-OS suites must pass on this commit before publishing.' 
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          emit release "$release"
          emit version "$version"
          emit prerelease "$prerelease"
          emit draft "$draft"
          emit dry_run "$dry_run"

  # --- the gate -------------------------------------------------------------
  # A release must pass exactly the same tests as a normal push: unit tests on
  # all three OSes, the logical end-to-end test and the real-OS suites. These are
  # the same workflow files, so there is one definition of "passing".
  tests:
    name: gate / tests
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    with:
      concurrency_suffix: release
    uses: ./.github/workflows/ci.yml

  real-os:
    name: gate / real OS
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    with:
      concurrency_suffix: release
    uses: ./.github/workflows/os-e2e.yml

  build:
    name: build
    needs: [prepare, tests, real-os]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: cross-compile
        run: make cross VERSION="${{ needs.prepare.outputs.version }}"

      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: smoke the linux build
        run: |
          ./dist/fleet-agent-linux-amd64 version
          ./dist/fleet-agent-linux-amd64 -h 2>&1 | head -3
          ./dist/fleet-server-linux-amd64 -h 2>&1 | head -3 || true

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [prepare, build]
    if: |
      needs.prepare.outputs.release == 'true' &&
      needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: create the release
        # Pinned to a commit: this step is the only one holding the write token.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # For a manual run this creates the tag at the tested commit.
          tag_name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.prepare.outputs.version }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          draft: ${{ needs.prepare.outputs.draft == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/fleet-agent-*
            dist/fleet-server-*
            dist/SHA256SUMS
          body: |
            Cross-built from `${{ github.sha }}`.

            | file | what |
            |---|---|
            | `fleet-agent-<os>-<arch>` | the agent (run as root/SYSTEM) |
            | `fleet-server-<os>-<arch>` | the control plane |
            | `SHA256SUMS` | verify with `sha256sum -c SHA256SUMS` |

            Quick start:

            ```bash
            # control plane
            FLEET_ADMIN_TOKEN=$(openssl rand -hex 24) ./fleet-server-linux-amd64 -addr :8080
            # on a managed machine (no browser download, so macOS never sets quarantine)
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ needs.prepare.outputs.version }}/fleet-agent-darwin-arm64
            sudo install -m 0755 fleet-agent-darwin-arm64 /usr/local/bin/fleet-agent
            sudo fleet-agent enroll -server https://fleet.example.com -token <TOKEN>
            ```

            **Binaries are unsigned.** Install the agent with `curl`/`ssh` rather
            than a browser download so Gatekeeper never sees a quarantine flag, or
            follow the free self-signed-CA recipe in `docs/provisioning.md`.
            Nothing here needs an Apple Developer Program or a code signing
            certificate.

  verify-release:
    name: verify the published release
    needs: [prepare, publish]
    if: |
      needs.prepare.outputs.release == 'true' &&
      needs.prepare.outputs.draft != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: local

      - name: download it back from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p remote
          gh release download "${{ needs.prepare.outputs.version }}" \
            --repo "${{ github.repository }}" --dir remote --pattern '*'
          ls -l remote

      - name: compare and run
        run: |
          set -euo pipefail
          cd remote
          # Same bytes were published as were built.
          for f in *; do
            cmp "$f" "../local/$f" || { echo "::error::$f differs from the built artefact"; exit 1; }
          done
          # The checksums describe the files that are actually attached.
          sha256sum -c SHA256SUMS
          # The linux binaries really execute.
          chmod +x fleet-agent-linux-amd64 fleet-server-linux-amd64
          ./fleet-agent-linux-amd64 version
          ./fleet-server-linux-amd64 -h >/dev/null 2>&1 || true
